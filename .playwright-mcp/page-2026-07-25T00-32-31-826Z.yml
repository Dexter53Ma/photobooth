            - generic [ref=f11e497]:
              - button "¿Por qué elegir Fotomatón Barcelona?" [ref=f11e498]
              - paragraph [ref=f11e502]: En Fotomatón Barcelona, llevamos desde 2013 ofreciendo un servicio profesional, innovador y altamente valorado en eventos corporativos y bodas. Nuestra experiencia y compromiso con la excelencia nos han convertido en la opción preferida de más de 1.200 marcas y miles de clientes satisfechos.
            - generic [ref=f11e503]:
              - button "¿Hay mínimo de horas de servicio?" [ref=f11e504]
              - paragraph [ref=f11e508]: En general, el mínimo tiempo de servicio es de 3 horas en servicios de fotomatón y de 2 horas en spin 360.
            - generic [ref=f11e509]:
              - button "¿Hay un máximo de fotografías y copias / vídeos?" [ref=f11e510]
              - paragraph [ref=f11e514]: En general, tanto las fotos como las copias impresas y los vídeos son ilimitados durante todo el servicio.
            - generic [ref=f11e515]:
              - button "¿Puedo personalizar el servicio?" [ref=f11e516]
              - paragraph [ref=f11e520]: La personalización de los servicios es uno de nuestros puntos fuertes. Puedes personalizar el vinilado, el diseño de las tiras de impresión, la mosca de los vídeos, el photocall o fondo, crear vídeos de entrada y salida… ¡te damos muchísimas opciones!
            - generic [ref=f11e521]:
              - button "¿Cuánto tiempo es necesario para el montaje?" [ref=f11e522]
              - paragraph [ref=f11e526]: El montaje puede variar según el lugar del evento y servicio contratado. Llegamos 30 min (bodas) / 1h (eventos) antes del servicio para montar.
            - generic [ref=f11e527]:
              - button "¿Cómo reservo y pago el servicio?" [ref=f11e528]
              - paragraph [ref=f11e532]: Para confirmar la reserva hay que realizar el ingreso indicado en cada presupuesto. El resto se puede hacer antes o el mismo día del evento por transferencia o efectivo.
