              - button "¿Por qué elegir Fotomatón Barcelona?" [ref=f10e498]
              - paragraph [ref=f10e502]: En Fotomatón Barcelona, llevamos desde 2013 ofreciendo un servicio profesional, innovador y altamente valorado en eventos corporativos y bodas. Nuestra experiencia y compromiso con la excelencia nos han convertido en la opción preferida de más de 1.200 marcas y miles de clientes satisfechos.
            - generic [ref=f10e503]:
              - button "¿Hay mínimo de horas de servicio?" [ref=f10e504]
              - paragraph [ref=f10e508]: En general, el mínimo tiempo de servicio es de 3 horas en servicios de fotomatón y de 2 horas en spin 360.
            - generic [ref=f10e509]:
              - button "¿Hay un máximo de fotografías y copias / vídeos?" [ref=f10e510]
              - paragraph [ref=f10e514]: En general, tanto las fotos como las copias impresas y los vídeos son ilimitados durante todo el servicio.
