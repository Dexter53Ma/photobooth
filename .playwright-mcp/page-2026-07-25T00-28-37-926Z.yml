              - button "¿Puedo personalizar el servicio?" [ref=f10e516]
              - paragraph [ref=f10e520]: La personalización de los servicios es uno de nuestros puntos fuertes. Puedes personalizar el vinilado, el diseño de las tiras de impresión, la mosca de los vídeos, el photocall o fondo, crear vídeos de entrada y salida… ¡te damos muchísimas opciones!
            - generic [ref=f10e521]:
              - button "¿Cuánto tiempo es necesario para el montaje?" [ref=f10e522]
              - paragraph [ref=f10e526]: El montaje puede variar según el lugar del evento y servicio contratado. Llegamos 30 min (bodas) / 1h (eventos) antes del servicio para montar.
            - generic [ref=f10e527]:
