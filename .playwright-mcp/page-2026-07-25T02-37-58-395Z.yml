      - generic [ref=f20e444]:
        - heading "Questions fréquentes" [level=3] [ref=f20e445]
        - generic [ref=f20e446]:
          - generic [ref=f20e447]:
            - button "Pourquoi choisir Marrakech PhotoBooths ?" [ref=f20e448]
            - paragraph [ref=f20e452]: Chez Marrakech PhotoBooths, nous offrons depuis des années un service professionnel, innovant et hautement apprécié lors d'événements d'entreprise et de mariages. Notre expérience et notre engagement envers l'excellence font de nous le choix préféré de nombreuses marques et de milliers de clients satisfaits.
          - generic [ref=f20e453]:
            - button "Y a-t-il un minimum d'heures de service ?" [ref=f20e454]
            - paragraph [ref=f20e458]: En général, le temps minimum de service est de 3 heures pour les services de photobooth et de 2 heures pour le spin 360.
          - generic [ref=f20e459]:
            - button "Y a-t-il un maximum de photos et de copies / vidéos ?" [ref=f20e460]
            - paragraph [ref=f20e464]: En général, les photos, les copies imprimées et les vidéos sont illimitées pendant tout le service.
          - generic [ref=f20e465]:
            - button "Puis-je personnaliser le service ?" [ref=f20e466]
            - paragraph [ref=f20e470]: La personnalisation des services est l'un de nos points forts. Vous pouvez personnaliser le vinyle, le design des bandes d'impression, le filigrane des vidéos, le photocall ou le fond, créer des vidéos d'entrée et de sortie… Nous vous offrons de nombreuses options !
          - generic [ref=f20e471]:
            - button "Combien de temps faut-il pour l'installation ?" [ref=f20e472]
            - paragraph [ref=f20e476]: L'installation peut varier selon le lieu de l'événement et le service choisi. Nous arrivons 30 min (mariages) / 1h (événements) avant le début du service pour installer.
          - generic [ref=f20e477]:
            - button "Comment réserver et payer le service ?" [ref=f20e478]
            - paragraph [ref=f20e482]: Pour confirmer la réservation, il faut effectuer le versement indiqué dans chaque devis. Le reste peut être fait avant ou le jour de l'événement par virement ou en espèces.
      - generic [ref=f20e485]:
        - heading "Contact" [level=2] [ref=f20e486]
        - generic [ref=f20e487]:
          - paragraph [ref=f20e488]: Vous avez un événement ou une célébration et vous souhaitez surprendre vos invité(e)s ?
          - paragraph [ref=f20e489]: Vous souhaitez que vos invité(e)s s'amusent et repartent avec un beau souvenir ?
          - paragraph [ref=f20e490]: Vous aimeriez concrétiser vos idées et offrir des services entièrement personnalisés ?
          - paragraph [ref=f20e491]: Chez Marrakech PhotoBooths, nous avons tous les outils, l'expérience et la motivation pour rendre votre événement unique et mémorable.
