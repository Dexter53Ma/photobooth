    - generic [ref=f16e52]:
      - heading "¿Quiénes somos?" [level=2] [ref=f16e54]
      - generic [ref=f16e56]:
        - paragraph [ref=f16e57]:
          - text: En
          - strong [ref=f16e58]: Fotomatón Barcelona
          - text: ", llevamos desde 2013 combinando innovación, diseño y tecnología para ofrecer experiencias únicas en eventos y celebraciones. Somos especialistas en alquiler de fotomatón, en soluciones audiovisuales para dinamizar eventos privados o corporativos y en servicios personalizados de impresión fotográfica con formatos novedosos. Con un equipo pionero en el sector, transformamos cualquier evento en una experiencia interactiva y divertida que genera recuerdos y experiencia de marca a partes iguales."
        - paragraph [ref=f16e59]: Nuestro equipo está formado por especialistas en diseño, imagen y nuevas tecnologías, lo que nos permite estar siempre a la vanguardia y ofrecer servicios personalizados de la más alta calidad. Creemos que el valor diferencial de nuestra empresa reside en nuestro equipo humano. Contamos con profesionales altamente capacitados y en constante formación, asegurando que cada proyecto se adapte a las últimas tendencias y necesidades de nuestros clientes. Nuestra pasión por la creatividad y el detalle nos ha convertido en un referente en el sector, ofreciendo soluciones innovadoras que transforman cualquier evento en una experiencia inolvidable.
        - paragraph [ref=f16e60]:
          - text: En
          - strong [ref=f16e61]: Fotomatón Barcelona
          - text: ", no solo capturamos momentos, los convertimos en recuerdos únicos."
