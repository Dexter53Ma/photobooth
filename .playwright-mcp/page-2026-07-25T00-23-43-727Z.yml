              - button "¿Por qué elegir Fotomatón Barcelona?" [ref=f8e490]
              - paragraph [ref=f8e494]: En Fotomatón Barcelona, llevamos desde 2013 ofreciendo un servicio profesional, innovador y altamente valorado en eventos corporativos y bodas. Nuestra experiencia y compromiso con la excelencia nos han convertido en la opción preferida de más de 1.200 marcas y miles de clientes satisfechos.
            - generic [ref=f8e495]:
              - button "¿Hay mínimo de horas de servicio?" [ref=f8e496]
              - paragraph [ref=f8e500]: En general, el mínimo tiempo de servicio es de 3 horas en servicios de fotomatón y de 2 horas en spin 360.
            - generic [ref=f8e501]:
              - button "¿Hay un máximo de fotografías y copias / vídeos?" [ref=f8e502]
              - paragraph [ref=f8e506]: En general, tanto las fotos como las copias impresas y los vídeos son ilimitados durante todo el servicio.
            - generic [ref=f8e507]:
              - button "¿Puedo personalizar el servicio?" [ref=f8e508]
              - paragraph [ref=f8e512]: La personalización de los servicios es uno de nuestros puntos fuertes. Puedes personalizar el vinilado, el diseño de las tiras de impresión, la mosca de los vídeos, el photocall o fondo, crear vídeos de entrada y salida… ¡te damos muchísimas opciones!
            - generic [ref=f8e513]:
              - button "¿Cuánto tiempo es necesario para el montaje?" [ref=f8e514]
              - paragraph [ref=f8e518]: El montaje puede variar según el lugar del evento y servicio contratado. Llegamos 30 min (bodas) / 1h (eventos) antes del servicio para montar.
            - generic [ref=f8e519]:
