          - heading "¿Quiénes somos?" [level=3] [ref=f38e16]
          - paragraph [ref=f38e17]: En Fotomatón Barcelona llevamos desde 2013 ofreciendo servicios profesionales de fotomatón para eventos corporativos y bodas. Nuestra pasión por el diseño, la tecnología y las experiencias memorables nos ha convertido en la opción preferida de más de 1.200 marcas y miles de clientes satisfechos.
          - paragraph [ref=f38e18]: Nos diferenciamos por nuestra capacidad de innovación, la calidad de nuestros servicios y la atención personalizada que ofrecemos a cada cliente. Cada evento es único y merece un fotomatón a la altura.
