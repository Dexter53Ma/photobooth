      - heading "¿CÓMO SE DESHABILITAN LAS COOKIES EN LOS NAVEGADORES?" [level=3] [ref=f7e105]
      - paragraph [ref=f7e106]: "El usuario puede, en cualquier momento, permitir, bloquear o eliminar las cookies instaladas en su equipo mediante la modificación de los parámetros de configuración del navegador instalado en su ordenador:"
      - paragraph [ref=f7e107]:
        - link "Chrome" [ref=f7e108] [cursor=pointer]:
          - /url: https://support.google.com/chrome/answer/95647?hl=es&ref_topic=3434352
        - text: Configuración -> Mostrar opciones avanzadas -> Privacidad -> Configuración del contenido Para más información, puede consultar
        - link "el soporte de Google" [ref=f7e109] [cursor=pointer]:
          - /url: https://support.google.com/chrome/answer/95647?hl=es&ref_topic=3434352
        - text: o la Ayuda del navegador.
      - paragraph [ref=f7e110]:
        - link "Explorer" [ref=f7e111] [cursor=pointer]:
          - /url: https://support.microsoft.com/es-es/office/ayuda-de-internet-explorer-23360e49-9cd3-4dda-ba52-705336cc0de2?ui=es-ES&rs=es-ES&ad=ES#ie=ie-11
        - text: Herramientas -> Opciones de Internet -> Privacidad -> Configuración Para más información, puede consultar
        - link "el soporte de Microsoft" [ref=f7e112] [cursor=pointer]:
          - /url: https://support.microsoft.com/es-es/office/ayuda-de-internet-explorer-23360e49-9cd3-4dda-ba52-705336cc0de2?ui=es-ES&rs=es-ES&ad=ES#ie=ie-11
        - text: o la Ayuda del navegador.
      - paragraph [ref=f7e113]:
        - link "Firefox" [ref=f7e114] [cursor=pointer]:
          - /url: https://support.mozilla.org/es/
        - text: ": Herramientas ->Opciones -> Privacidad -> Historial -> Configuración Personalizada para más información, puede consultar"
        - link "el soporte de Mozilla" [ref=f7e115] [cursor=pointer]:
          - /url: https://support.mozilla.org/es/
        - text: o la Ayuda del navegador.
      - paragraph [ref=f7e116]:
        - link "Safari" [ref=f7e117] [cursor=pointer]:
          - /url: https://support.apple.com/es-es/guide/safari/sfri11471/mac
        - text: Preferencias -> Seguridad Para más información, puede consultar
        - link "el soporte de Apple" [ref=f7e118] [cursor=pointer]:
          - /url: https://support.apple.com/es-es/guide/safari/sfri11471/mac
        - text: o la Ayuda del navegador.
      - paragraph [ref=f7e119]: La desactivación de las cookies no impide la navegación por el sitio web, aunque el uso de algunos de sus servicios podrá ser limitado y, por tanto, su experiencia de navegación podrá ser menos satisfactoria.
      - heading "RETIRAR EL CONSENTIMIENTO" [level=3] [ref=f7e120]
      - paragraph [ref=f7e121]: El usuario podrá retirar en cualquier momento su consentimiento relacionado con la Política de Cookies, y podrá eliminar las cookies almacenadas en su equipo a través de los ajustes y configuraciones de su navegador de Internet, indicados anteriormente, así como accediendo a nuestro panel de configuración:Ajuste de cookies
      - heading "CONFIGURAR COOKIES" [level=3] [ref=f7e122]
      - paragraph [ref=f7e123]: La presente Política de Cookies se podrá modificar cuando así lo exija la legislación vigente en cada momento o cuando hubiera alguna variación en el tipo de cookies utilizadas en el sitio web. Por ello, le recomendamos revisar esta política cada vez que acceda a nuestro sitio web con el objetivo de estar adecuadamente informado sobre cómo y para qué usamos las cookies.Ajuste de cookies
