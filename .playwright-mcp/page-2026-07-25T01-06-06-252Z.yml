            - generic [ref=f26e549]:
              - button "¿Por qué elegir Fotomatón Barcelona?" [ref=f26e550]
              - paragraph [ref=f26e554]: En Fotomatón Barcelona, llevamos desde 2013 ofreciendo un servicio profesional, innovador y altamente valorado en eventos corporativos y bodas. Nuestra experiencia y compromiso con la excelencia nos han convertido en la opción preferida de más de 1.200 marcas y miles de clientes satisfechos.
            - generic [ref=f26e555]:
              - button "¿Hay mínimo de horas de servicio?" [ref=f26e556]
              - paragraph [ref=f26e560]: En general, el mínimo tiempo de servicio es de 3 horas en servicios de fotomatón y de 2 horas en spin 360.
            - generic [ref=f26e561]:
              - button "¿Hay un máximo de fotografías y copias / vídeos?" [ref=f26e562]
              - paragraph [ref=f26e566]: En general, tanto las fotos como las copias impresas y los vídeos son ilimitados durante todo el servicio.
            - generic [ref=f26e567]:
              - button "¿Puedo personalizar el servicio?" [ref=f26e568]
              - paragraph [ref=f26e572]: La personalización de los servicios es uno de nuestros puntos fuertes. Puedes personalizar el vinilado, el diseño de las tiras de impresión, la mosca de los vídeos, el photocall o fondo, crear vídeos de entrada y salida… ¡te damos muchísimas opciones!
            - generic [ref=f26e573]:
              - button "¿Cuánto tiempo es necesario para el montaje?" [ref=f26e574]
              - paragraph [ref=f26e578]: El montaje puede variar según el lugar del evento y servicio contratado. Llegamos 30 min (bodas) / 1h (eventos) antes del servicio para montar.
            - generic [ref=f26e579]:
              - button "¿Cómo reservo y pago el servicio?" [ref=f26e580]
              - paragraph [ref=f26e584]: Para confirmar la reserva hay que realizar el ingreso indicado en cada presupuesto. El resto se puede hacer antes o el mismo día del evento por transferencia o efectivo.
